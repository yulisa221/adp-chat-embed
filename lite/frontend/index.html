<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI 助手</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #chat { position: fixed; inset: 0; }
    .embed-link { position: fixed; right: 16px; bottom: 0; z-index: 5; line-height: 15px; font: 12px -apple-system, 'PingFang SC', sans-serif; color: #8a919f; text-decoration: none; }
    .embed-link:hover { color: #4a70ff; }
    @media (max-width: 720px) { .embed-link { display: none; } }
  </style>
</head>
<body>
  <div id="chat"></div>
  <a class="embed-link" href="./embed.html">嵌入到你的网站 →</a>
  <!-- 整页对话：与嵌入到其它网站用的是同一套脚本 -->
  <script src="./adp-chat/adp-client.js"></script>
  <script src="./adp-chat/adp-chat-ui.js"></script>
  <script>
    var chat = ADPChatUI.mount('#chat')
    chat.client.config().then(function (c) { if (c.name) document.title = c.name })
  </script>
</body>
</html>
